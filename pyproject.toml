[project]
name = "python-miio"
version = "0.6.0"
description = "Python library for interfacing with Xiaomi smart appliances"
authors = [{ name = "Teemu R", email = "tpr@iki.fi" }]
requires-python = ">=3.14,<4"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["xiaomi", "miio", "miot", "smart home"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: System :: Hardware",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "click>=8",
    "cryptography>=35",
    "construct>=2.10.56,<3",
    "zeroconf>=0,<1",
    "attrs",
    "pytz",
    "platformdirs",
    "tqdm>=4,<5",
    "micloud>=0.6",
    "croniter>=1",
    "defusedxml>=0,<1",
    "pydantic>=2,<3",
    "PyYAML>=5,<7",
    "crcmod>=1.7",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx_click",
    "sphinxcontrib-apidoc",
    "sphinx_rtd_theme>=1.3.0",
    "myst-parser",
]
updater = ["netifaces>=0,<1"]

[project.urls]
Repository = "https://github.com/rytilahti/python-miio"
Documentation = "https://python-miio.readthedocs.io"

[project.scripts]
mirobo = "miio.integrations.roborock.vacuum.vacuum_cli:cli"
miio-extract-tokens = "miio.extract_tokens:main"
miiocli = "miio.cli:create_cli"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pre-commit",
    "doc8",
    "restructuredtext_lint",
    "tox",
    "isort",
    "cffi",
    "docformatter",
    "mypy ; platform_python_implementation == 'CPython'",
    "coverage[toml]",
    "sqlalchemy>=2.0.48",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["miio"]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"


[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88
forced_separate = "miio.discover"
known_first_party = "miio"
known_third_party = [
    "attr",
    "click",
    "construct",
    "croniter",
    "cryptography",
    "netifaces",
    "platformdirs",
    "pytest",
    "pytz",
    "setuptools",
    "tqdm",
    "zeroconf",
]


[tool.coverage.run]
source = ["miio"]
branch = true
omit = [
    "miio/*cli.py",
    "miio/extract_tokens.py",
    "miio/tests/*",
    "miio/version.py",
]

[tool.coverage.report]
exclude_lines = [
    # ignore abstract methods
    "raise NotImplementedError",
    "def __repr__",
]

[tool.mypy]
# misc disables "Decorated property not supported", see https://github.com/python/mypy/issues/1362
# annotation-unchecked disables "By default the bodies of untyped functions are not checked"
disable_error_code = "misc,annotation-unchecked"

[tool.doc8]
paths = ["docs"]
# docs/index.rst:7: D000 Error in "include" directive:
# invalid option value: (option: "parser"; value: 'myst_parser.sphinx_')
# Parser "myst_parser.sphinx_" not found. No module named 'myst_parser'.
ignore-path-errors = ["docs/index.rst;D000"]
